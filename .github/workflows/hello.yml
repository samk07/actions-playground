name: Hello World

env:
      APP_ENV: development
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Print message
        run: echo "Hello, GitHub Actions!"
        
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Print message
        run: echo "Building Project in $APP_ENV"
        
  test:
    runs-on: ubuntu-24.04
    needs: build
    env:
          STAGE: test
    steps:
      - name: Print message
        run: echo "Running tests in $STAGE stage"
    
